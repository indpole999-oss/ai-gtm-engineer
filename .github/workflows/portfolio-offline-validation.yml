name: Portfolio offline validation
on:
  push:
    branches:
      - portfolio/gtm-engineer-20261016
    paths:
      - "portfolio/**"
      - ".github/workflows/portfolio-offline-validation.yml"
  workflow_dispatch:
jobs:
  offline-portfolio:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline workflow unit tests
        run: python -m unittest discover -s portfolio -p 'test_*.py' -v
      - name: Check static portfolio artifacts
        run: |
          test -s portfolio/index.html
          test -s portfolio/styles.css
          test -s portfolio/main.js
          python -c "from pathlib import Path; p=Path('portfolio/index.html').read_text(); assert 'Run a workflow demo' in p; assert 'FICTIONAL' in Path('portfolio/main.js').read_text().upper()"
