name: Validate

on:
  pull_request:
  push:
    branches-ignore: [production]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Validate empty-database migration
        env:
          APP_ENV: test
          DATABASE_URL: sqlite+aiosqlite:////tmp/phase0-migration.db
        run: |
          alembic upgrade head
          test "$(alembic current | awk '{print $1}')" = "20260921_0001"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Targeted correctness lint
        run: |
          npx eslint src/routes/_authenticated/crm.tsx --no-cache --rule 'prettier/prettier: off'
