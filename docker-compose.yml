services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_gtm
      POSTGRES_USER: ai_gtm
      POSTGRES_PASSWORD: local-development-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_gtm -d ai_gtm"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: deployment/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment: &backend_environment
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://ai_gtm:local-development-only@database:5432/ai_gtm
      SECRET_KEY: local-compose-secret-not-for-production
      INTEGRATION_ENCRYPTION_KEY: ""
      ALLOW_LEGACY_ENV_CREDENTIALS: "true"
      AUTO_CREATE_TABLES: "false"
      CORS_ORIGINS: '["http://localhost:3000"]'
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: deployment/Dockerfile
    environment: *backend_environment
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"

  frontend:
    build:
      context: frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  postgres_data:
